# Semillas del catálogo de prueba (escenario B).
#
# Son modelos que existen en el mercado, con specs tomadas de fichas de referencia del fabricante
# (pueden variar según la versión exacta). Los PRECIOS Y EL STOCK SON INVENTADOS.
#
# `atributos` es la verdad: con esto se generan las descripciones desprolijas y las etiquetas
# contra las que se mide la extracción. `null` = el dato no se conoce (y no se escribe).
# `extra` son datos que van a la descripción como ruido o distractor, pero no son atributos.
# `declarados` son atributos que la fuente entrega como dato estructurado (no se escriben en el
# texto ni se miden en la extracción): los que usan las reglas de compatibilidad del catálogo real
# (generación, consumo máximo, cooler y video incluidos, ranuras, potencia del cooler). El resto de
# los declarados (módulos del kit, conexión del disco, fuente recomendada, fuente del gabinete) los
# deduce el generador (`_declarados`). Ojo: en YAML el «no» suelto es falso; va entre comillas.

