# Consultas de evaluación del RAG (consultar_caracteristicas), problema 5.
#
# Cada consulta está escrita como la haría un usuario o el modelo. Campos:
#   consulta: texto de la búsqueda.
#   fuente:   archivo de rag/docs/ que tiene la respuesta.
#   debe:     texto que solo aparece en el fragmento correcto (se busca tal cual); puede ser una lista
#             si hay más de un fragmento correcto (la prosa y el perfil generado dicen lo mismo).
#   gama:     gama de la que habla la consulta (para medir cuántos fragmentos traen otra gama).
#
# Si se reescribe un documento y cambia el texto de `debe`, hay que actualizarlo acá.
# Uso: uv run python -m evaluacion.rag

consultas:
